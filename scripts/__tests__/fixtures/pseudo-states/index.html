<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forced pseudo-state timing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <label class="row" for="terms">
      <input id="terms" type="checkbox" class="box">
      <span class="box-face"></span>
      <span class="label">Accept terms</span>
    </label>

    <label class="row" for="news">
      <input id="news" type="checkbox" class="box" checked>
      <span class="box-face"></span>
      <span class="label">Weekly news</span>
    </label>

    <button id="gone" class="btn" disabled>Unavailable</button>
    <button id="live" class="btn">Available</button>
  </main>
</body>
</html>
