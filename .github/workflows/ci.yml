name: ci

# Pull requests are checked against every branch they target: a change proposed
# for develop was previously unverified until it reached main, which is the one
# branch where a red run blocks a release instead of a review.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# The default token is broader than this workflow needs, and a workflow file is
# the one place a compromised dependency can act with it.
permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, windows-latest]
    steps:
      # Pinned to a commit, not a tag: a tag is mutable and a moved one runs
      # different code with this repository's token.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium  # required: css-animation-extract.test.mjs launches a real browser

      # The runner keeps the full log, but a maintainer without admin rights
      # cannot download it, so a red Windows job was undebuggable from outside.
      # The TAP stream and the runner's own environment go up as an artifact on
      # failure only: the log names the failing test, the environment explains
      # why this OS differs.
      - name: test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.tap

      - name: environment
        if: always()
        shell: bash
        run: |
          {
            echo "node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "os: $RUNNER_OS"
            echo "arch: $RUNNER_ARCH"
            node -p "process.platform + ' ' + process.version + ' ' + process.arch"
          } > environment.txt
          node -e "console.log(require('playwright/package.json').version)" > playwright-version.txt || true

      # An artifact needs a token to download and a job log needs admin rights,
      # so a public red run said only "npm test failed". Annotations are readable
      # by anyone through the check-runs API and appear on the pull request, so
      # the failing test names and the environment go there too.
      - name: annotate the failures
        if: failure()
        shell: bash
        run: |
          echo "### ${{ matrix.node }} on ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat environment.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-output.tap ]; then
            grep -E '^not ok' test-output.tap | head -20 > failing.txt || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Failing tests:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat failing.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=test failure::$line"
            done < failing.txt
          fi

      - name: upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-failure-${{ matrix.node }}-${{ matrix.os }}
          path: |
            test-output.tap
            environment.txt
            playwright-version.txt
          retention-days: 14

  smoke:
    name: repository gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Documentation drift is invisible to a test run: a flag the README
      # advertises and no parser accepts reads as correct until someone types it.
      - run: npm run lint
      # The manifests are what the marketplaces read. A missing field fails for
      # the user installing the plugin, not for the person editing it.
      - run: npm run validate
      # Production dependencies only: an advisory in the dev tree is worth
      # knowing about but is not a reason to block a release.
      - run: npm audit --omit=dev --audit-level=high

      - run: npx playwright install --with-deps chromium
      # A unit suite that only proves the modules agree with each other cannot
      # prove the capture still works against a real page. These do.
      - run: node scripts/__tests__/redirect-ssrf.smoke.mjs
      # Captures the checked-in fixture, not a third party. Against
      # tailwindcss.com a redesign there turned a real regression green and an
      # outage turned CI red for reasons that had nothing to do with this repo.
      - run: node scripts/__tests__/local-capture.smoke.mjs /tmp/de-smoke
      - run: node scripts/__tests__/offline-tree.smoke.mjs /tmp/de-smoke/live
      # The unit suite runs from the working tree and cannot see what npm
      # actually ships. A packaging slip publishes a package whose every path
      # is missing, and nothing fails until a user installs it.
      - run: node scripts/__tests__/pack-contents.smoke.mjs
